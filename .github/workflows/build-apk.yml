name: Build CyberChat APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure public Supabase client key
        env:
          CYBERCHAT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CYBERCHAT_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          key=os.environ.get('CYBERCHAT_SUPABASE_PUBLISHABLE_KEY') or 'sb_publishable_xTW2vZ0RyZg_k-LrwAPWKg_UOLVS0ZZ'
          config={'url':'https://hdilpmoervxkkapvfkdc.supabase.co','publishableKey':key}
          Path('app/src/main/assets/config.js').write_text('window.CYBERCHAT_CONFIG='+json.dumps(config)+';')
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --info
      - name: Show APK output
        if: success()
        run: ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: CyberChat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare direct-download APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CyberChat-v0.2.1-beta.apk
      - name: Commit raw downloadable APK
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/CyberChat-latest.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/CyberChat-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Update direct CyberChat APK [skip ci]'
            git push origin HEAD:main
          fi
      - name: Publish direct-download APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1-beta
          name: CyberChat v0.2.1 Beta
          prerelease: true
          generate_release_notes: false
          body: Android beta debug APK for testing. Not all planned features are implemented.
          files: CyberChat-v0.2.0-beta.apk
          fail_on_unmatched_files: true
