name: Build CyberChat APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure public Supabase client key
        env:
          CYBERCHAT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CYBERCHAT_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          key=os.environ.get('CYBERCHAT_SUPABASE_PUBLISHABLE_KEY') or 'sb_publishable_xTW2vZ0RyZg_k-LrwAPWKg_UOLVS0ZZ'
          config={'url':'https://hdilpmoervxkkapvfkdc.supabase.co','publishableKey':key}
          Path('app/src/main/assets/config.js').write_text('window.CYBERCHAT_CONFIG='+json.dumps(config)+';')
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CyberChat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
