<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberChat Members</title><style>body{margin:0;background:#030814;color:#f2f7ff;font:15px system-ui}main{max-width:680px;margin:auto;padding:20px}h1{color:#00c8ff}section{background:#0a1930;border:1px solid #173a70;border-radius:16px;padding:16px;margin:12px 0}input,button{font:inherit;border-radius:10px;padding:12px;margin:5px 0;box-sizing:border-box}input{width:100%;background:#10213d;border:1px solid #173a70;color:white}button{background:#087cff;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.muted{color:#98add4}#messages{height:35vh;overflow:auto}#messages p{background:#10213d;padding:10px;border-radius:12px;overflow-wrap:anywhere}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}</style></head><body><main><h1>CyberChat</h1><p class="muted">CyberPulse members only</p><p id="notice" role="status"></p><section id="auth"><h2>Member sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="nickname" maxlength="80" placeholder="Display name"><div class="row"><button id="login">Sign in</button><button id="signup">Register</button></div></section><div id="app" hidden><button id="logout">Sign out</button><section><h2>Member directory</h2><div id="directory"></div></section><section><h2>My conversations</h2><input id="title" placeholder="New conversation title"><button id="create">Create private chat space</button><div id="rooms"></div><p class="muted">Group owners can add a member using their member ID.</p><input id="memberId" placeholder="Member ID"><button id="addMember">Add member to selected group</button></section><section id="chat" hidden><h2 id="chatname"></h2><div id="messages"></div><div class="row"><input id="message" maxlength="10000" placeholder="Message"><button id="send">Send</button></div></section></div><p><a style="color:#00c8ff" href="index.html">Prototype interface</a></p></main><script src="config.js"></script><script src="online.js"></script></body></html>
